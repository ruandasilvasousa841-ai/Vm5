name: Pure RDP via Tailscale - VM 5

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP Service & User
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $user = "pctop5"
          $plainPass = "Cinco@RDP#2025"
          $securePass = ConvertTo-SecureString $plainPass -AsPlainText -Force

          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $user
          }

          New-LocalUser -Name $user -Password $securePass -PasswordNeverExpires -AccountNeverExpires -Description "RDP User VM5"
          Add-LocalGroupMember -Group "Administrators" -Member $user
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user

          echo "RDP_USER=$user" >> $env:GITHUB_ENV
          echo "RDP_PASS=$plainPass" >> $env:GITHUB_ENV

      - name: Install and Connect Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/S" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=github-vm5-$env:GITHUB_RUN_ID
          $tsIP = $null
          for ($i=1; $i -le 15; $i++){
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if($tsIP){break}
            Start-Sleep 4
          }
          if (-not $tsIP) { exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Display Connection Details and Keep Alive
        shell: powershell
        run: |
          Write-Host "================ RDP IS READY (VM 5) ================"
          Write-Host "IP Address: ${{ env.TAILSCALE_IP }}"
          Write-Host "Username : ${{ env.RDP_USER }}"
          Write-Host "Password : ${{ env.RDP_PASS }}"
          Write-Host "====================================================="
          while ($true) { Start-Sleep 300 }
